# Render Blueprint: New → Blueprint → pick this repo.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: srinishtha-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/version
    envVars:
      - key: RACK_ENV
        value: production
      - key: DB_URL
        sync: false # Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false # e.g. https://srinishtha.vercel.app (or your custom domain)
      - key: CORS_ORIGINS
        sync: false # same as SITE_URL; comma-separate several origins
      - key: POOL_SIZE
        value: "5"
      - key: DB_VALIDATION_TIMEOUT
        value: "60"
